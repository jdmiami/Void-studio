name: Compile iPhone and iPad

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/apple.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/apple.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: iOS device and simulator builds
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Compile for iPhone and iPad
        run: >
          xcodebuild -project ios/VoidStudio.xcodeproj -scheme VoidStudio
          -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build/apple-device CODE_SIGNING_ALLOWED=NO build
      - name: Compile for iOS Simulator
        run: >
          xcodebuild -project ios/VoidStudio.xcodeproj -scheme VoidStudio
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/apple-simulator CODE_SIGNING_ALLOWED=NO build
      - name: Package builds
        run: |
          mkdir -p build/apple-artifacts
          ditto -c -k --keepParent build/apple-device/Build/Products/Release-iphoneos/VoidStudio.app build/apple-artifacts/VoidStudio-iphoneos-unsigned.zip
          ditto -c -k --keepParent build/apple-simulator/Build/Products/Debug-iphonesimulator/VoidStudio.app build/apple-artifacts/VoidStudio-iphonesimulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: void-studio-apple
          path: build/apple-artifacts/*.zip
          if-no-files-found: error
